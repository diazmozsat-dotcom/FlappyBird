<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird Deluxe</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts with fallbacks -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka One', 'Nunito', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-0 m-0 overflow-hidden w-screen h-screen">

    <!-- Game Container -->
    <div id="gameContainer" class="relative w-full h-full bg-slate-900 overflow-hidden flex items-center justify-center">
        
        <!-- Canvas Element -->
        <canvas id="gameCanvas" width="400" height="600" class="block cursor-pointer select-none touch-none shadow-2xl rounded-lg"></canvas>

        <!-- UI Overlay: Top Right Control Buttons -->
        <div class="absolute top-4 right-4 flex items-center space-x-3 z-20">
            <!-- Fullscreen Toggle Button -->
            <button id="fullscreenToggle" aria-label="Toggle Fullscreen" class="bg-slate-900/70 hover:bg-slate-800 text-white p-3 rounded-full backdrop-blur-md transition-all duration-200 shadow-xl active:scale-95 border border-white/20">
                <svg id="fsIconExpand" class="w-6 h-6 fill-current text-sky-400" viewBox="0 0 24 24">
                    <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
                <svg id="fsIconCompress" class="w-6 h-6 fill-current text-sky-400 hidden" viewBox="0 0 24 24">
                    <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
                </svg>
            </button>

            <!-- Sound Toggle Button -->
            <button id="soundToggle" aria-label="Toggle Sound" class="bg-slate-900/70 hover:bg-slate-800 text-white p-3 rounded-full backdrop-blur-md transition-all duration-200 shadow-xl active:scale-95 border border-white/20">
                <svg id="soundIconOn" class="w-6 h-6 fill-current text-yellow-400" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <svg id="soundIconOff" class="w-6 h-6 fill-current text-slate-400 hidden" viewBox="0 0 24 24">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Main Game Logic -->
    <script>
        // --- Web Audio Synthesizer ---
        class SoundFX {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            playJump() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(350, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(750, this.ctx.currentTime + 0.12);
                    
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch(e){}
            }

            playScore() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, this.ctx.currentTime + 0.08); // E5

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                } catch(e){}
            }

            playHit() {
                if (this.muted || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.2);

                    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                } catch(e){}
            }
        }

        const audio = new SoundFX();

        // --- Sound Toggle Handlers ---
        const soundBtn = document.getElementById('soundToggle');
        const soundOnIcon = document.getElementById('soundIconOn');
        const soundOffIcon = document.getElementById('soundIconOff');

        soundBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.muted = !audio.muted;
            if (audio.muted) {
                soundOnIcon.classList.add('hidden');
                soundOffIcon.classList.remove('hidden');
            } else {
                soundOnIcon.classList.remove('hidden');
                soundOffIcon.classList.add('hidden');
                audio.init();
            }
        });

        // --- Fullscreen Handler ---
        const container = document.getElementById('gameContainer');
        const fsBtn = document.getElementById('fullscreenToggle');
        const fsIconExpand = document.getElementById('fsIconExpand');
        const fsIconCompress = document.getElementById('fsIconCompress');

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        fsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleFullscreen();
        });

        document.addEventListener('fullscreenchange', updateFullscreenIcons);
        document.addEventListener('webkitfullscreenchange', updateFullscreenIcons);

        function updateFullscreenIcons() {
            const isFs = !!document.fullscreenElement || !!document.webkitFullscreenElement;
            if (isFs) {
                fsIconExpand.classList.add('hidden');
                fsIconCompress.classList.remove('hidden');
            } else {
                fsIconExpand.classList.remove('hidden');
                fsIconCompress.classList.add('hidden');
            }
            resizeCanvas();
        }

        // --- Canvas Setup & Responsive Resizing ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const GAME_WIDTH = 400;
        const GAME_HEIGHT = 600;

        function resizeCanvas() {
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // Calculate scale ratio preserving 2:3 aspect ratio
            const scale = Math.min(windowWidth / GAME_WIDTH, windowHeight / GAME_HEIGHT);

            canvas.style.width = `${Math.floor(GAME_WIDTH * scale)}px`;
            canvas.style.height = `${Math.floor(GAME_HEIGHT * scale)}px`;
        }

        window.addEventListener('resize', resizeCanvas);

        // RoundRect Polyfill for Canvas
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        // --- Game States & Scores ---
        const STATE = {
            START: 0,
            PLAYING: 1,
            GAMEOVER: 2
        };
        let currentState = STATE.START;

        let highScore = 0;
        try {
            highScore = localStorage.getItem('fb_high_score') ? parseInt(localStorage.getItem('fb_high_score')) : 0;
        } catch(e){}

        let score = 0;
        let shakeTime = 0;

        // Background / Foreground Scroll Speed
        let bgOffset = 0;
        let fgOffset = 0;
        const bgSpeed = 0.5;
        const fgSpeed = 2.0;

        // --- Game Entities ---
        const bird = {
            x: 80,
            y: 280,
            width: 36,
            height: 26,
            gravity: 0.45,
            lift: -8.0,
            velocity: 0,
            rotation: 0,
            wingFrame: 0,
            wingTimer: 0,
            particles: [],

            reset() {
                this.y = 280;
                this.velocity = 0;
                this.rotation = 0;
                this.particles = [];
            },

            flap() {
                this.velocity = this.lift;
                audio.playJump();

                // Particle FX on Jump
                for (let i = 0; i < 4; i++) {
                    this.particles.push({
                        x: this.x - 6,
                        y: this.y + 6,
                        vx: (Math.random() - 0.5) * 3 - 1,
                        vy: (Math.random() - 0.5) * 3 + 1,
                        size: Math.random() * 4 + 2,
                        alpha: 1
                    });
                }
            },

            update() {
                this.velocity += this.gravity;
                this.y += this.velocity;

                // Smooth Rotation
                const targetRotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, (this.velocity / 12)));
                this.rotation += (targetRotation - this.rotation) * 0.2;

                // Wing Animation
                this.wingTimer += 0.2;
                this.wingFrame = Math.sin(this.wingTimer);

                // Particles update
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    const p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.04;
                    if (p.alpha <= 0) {
                        this.particles.splice(i, 1);
                    }
                }
            },

            draw() {
                // Particles
                ctx.save();
                this.particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });
                ctx.restore();

                // Bird Body
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                // Body Gradient
                const bodyGrad = ctx.createLinearGradient(-18, -13, 18, 13);
                bodyGrad.addColorStop(0, '#facc15');
                bodyGrad.addColorStop(1, '#eab308');

                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.ellipse(0, 0, 18, 13, 0, 0, Math.PI * 2);
                ctx.fill();

                // Belly Highlight
                ctx.fillStyle = '#fef08a';
                ctx.beginPath();
                ctx.ellipse(-2, 3, 11, 7, 0.2, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(7, -5, 6, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(9, -5, 3, 0, Math.PI * 2);
                ctx.fill();

                // Beak
                const beakGrad = ctx.createLinearGradient(10, 0, 22, 5);
                beakGrad.addColorStop(0, '#f97316');
                beakGrad.addColorStop(1, '#ea580c');
                ctx.fillStyle = beakGrad;
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(22, 3);
                ctx.lineTo(10, 8);
                ctx.closePath();
                ctx.fill();

                // Wing
                ctx.fillStyle = '#ca8a04';
                ctx.beginPath();
                const wingYOffset = this.wingFrame * 4;
                ctx.ellipse(-6, 2 + wingYOffset, 8, 5, -0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        };

        // --- Pipes ---
        const pipes = {
            list: [],
            width: 64,
            gap: 150,
            spawnTimer: 0,
            spawnInterval: 100,

            reset() {
                this.list = [];
                this.spawnTimer = 0;
            },

            update() {
                this.spawnTimer++;
                if (this.spawnTimer >= this.spawnInterval) {
                    this.spawnTimer = 0;

                    const minHeight = 60;
                    const maxHeight = GAME_HEIGHT - 120 - this.gap - minHeight;
                    const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

                    this.list.push({
                        x: GAME_WIDTH,
                        top: topHeight,
                        bottom: GAME_HEIGHT - 120 - (topHeight + this.gap),
                        passed: false
                    });
                }

                for (let i = this.list.length - 1; i >= 0; i--) {
                    const p = this.list[i];
                    p.x -= fgSpeed;

                    // Pass Check
                    if (!p.passed && p.x + this.width < bird.x) {
                        p.passed = true;
                        score++;
                        audio.playScore();
                        if (score > highScore) {
                            highScore = score;
                            try {
                                localStorage.setItem('fb_high_score', highScore);
                            } catch(e){}
                        }
                    }

                    // Remove offscreen
                    if (p.x + this.width < -10) {
                        this.list.splice(i, 1);
                    }
                }
            },

            draw() {
                this.list.forEach(p => {
                    const pipeGrad = ctx.createLinearGradient(p.x, 0, p.x + this.width, 0);
                    pipeGrad.addColorStop(0, '#22c55e');
                    pipeGrad.addColorStop(0.3, '#4ade80');
                    pipeGrad.addColorStop(0.7, '#16a34a');
                    pipeGrad.addColorStop(1, '#15803d');

                    // Top Pipe
                    ctx.fillStyle = pipeGrad;
                    ctx.fillRect(p.x, 0, this.width, p.top);
                    ctx.fillRect(p.x - 4, p.top - 24, this.width + 8, 24);
                    
                    // Top Cap Details
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(p.x - 4, p.top - 24, this.width + 8, 4);
                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    ctx.fillRect(p.x - 4, p.top - 4, this.width + 8, 4);

                    // Bottom Pipe
                    const bottomY = GAME_HEIGHT - 120 - p.bottom;
                    ctx.fillStyle = pipeGrad;
                    ctx.fillRect(p.x, bottomY, this.width, p.bottom);
                    ctx.fillRect(p.x - 4, bottomY, this.width + 8, 24);

                    // Bottom Cap Details
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fillRect(p.x - 4, bottomY, this.width + 8, 4);
                    ctx.fillStyle = 'rgba(0,0,0,0.25)';
                    ctx.fillRect(p.x - 4, bottomY + 20, this.width + 8, 4);
                });
            }
        };

        // --- Collision System ---
        function checkCollisions() {
            const groundY = GAME_HEIGHT - 120;

            // Ground
            if (bird.y + bird.height / 2 >= groundY) {
                triggerGameOver();
                return;
            }

            // Ceiling
            if (bird.y - bird.height / 2 <= 0) {
                bird.y = bird.height / 2;
                bird.velocity = 0;
            }

            // Pipes Collision
            const bLeft = bird.x - 14;
            const bRight = bird.x + 14;
            const bTop = bird.y - 10;
            const bBottom = bird.y + 10;

            for (let i = 0; i < pipes.list.length; i++) {
                const p = pipes.list[i];
                const pLeft = p.x;
                const pRight = p.x + pipes.width;
                const pTopEnd = p.top;
                const pBottomStart = GAME_HEIGHT - 120 - p.bottom;

                if (bRight > pLeft && bLeft < pRight) {
                    if (bTop < pTopEnd || bBottom > pBottomStart) {
                        triggerGameOver();
                        return;
                    }
                }
            }
        }

        function triggerGameOver() {
            shakeTime = 15;
            audio.playHit();
            currentState = STATE.GAMEOVER;
        }

        // --- Parallax Background & Ground ---
        function drawBackground() {
            // Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT - 120);
            skyGrad.addColorStop(0, '#0284c7');
            skyGrad.addColorStop(0.7, '#38bdf8');
            skyGrad.addColorStop(1, '#bae6fd');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT - 120);

            // Parallax Clouds
            bgOffset = (bgOffset + bgSpeed) % GAME_WIDTH;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';

            for (let i = -1; i < 2; i++) {
                const cx = i * GAME_WIDTH - bgOffset;
                ctx.beginPath();
                ctx.arc(cx + 80, 360, 50, 0, Math.PI * 2);
                ctx.arc(cx + 130, 340, 70, 0, Math.PI * 2);
                ctx.arc(cx + 190, 360, 50, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(cx + 300, 200, 30, 0, Math.PI * 2);
                ctx.arc(cx + 330, 190, 45, 0, Math.PI * 2);
                ctx.arc(cx + 370, 200, 35, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawForeground() {
            const groundY = GAME_HEIGHT - 120;

            // Grass Header
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, groundY, GAME_WIDTH, 14);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(0, groundY + 14, GAME_WIDTH, 6);

            // Dirt Body
            const dirtGrad = ctx.createLinearGradient(0, groundY + 20, 0, GAME_HEIGHT);
            dirtGrad.addColorStop(0, '#eab308');
            dirtGrad.addColorStop(1, '#ca8a04');
            ctx.fillStyle = dirtGrad;
            ctx.fillRect(0, groundY + 20, GAME_WIDTH, 100);

            // Dynamic Scrolling Pattern
            if (currentState !== STATE.GAMEOVER) {
                fgOffset = (fgOffset + fgSpeed) % 30;
            }

            ctx.strokeStyle = 'rgba(161, 98, 7, 0.4)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            for (let x = -30 - fgOffset; x < GAME_WIDTH + 30; x += 30) {
                ctx.moveTo(x, groundY + 20);
                ctx.lineTo(x - 20, GAME_HEIGHT);
            }
            ctx.stroke();
        }

        // --- Render UI Screens ---
        function drawUI() {
            if (currentState === STATE.START) {
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(0,0,0,0.4)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 4;
                ctx.font = '36px "Fredoka One", cursive, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('FLAPPY BIRD', GAME_WIDTH / 2, 160);

                ctx.font = '20px "Nunito", sans-serif';
                ctx.fillStyle = '#fef08a';
                ctx.fillText('DELUXE EDITION', GAME_WIDTH / 2, 195);

                const bounce = Math.sin(Date.now() * 0.005) * 6;
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 18px "Nunito", sans-serif';
                ctx.fillText('Tap screen or Press Space', GAME_WIDTH / 2, 370 + bounce);

                // Instructions Box
                ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
                ctx.roundRect(GAME_WIDTH / 2 - 120, 410, 240, 60, 12);
                ctx.fill();

                ctx.fillStyle = '#e2e8f0';
                ctx.font = '14px "Nunito", sans-serif';
                ctx.fillText('Avoid pipes & reach top scores!', GAME_WIDTH / 2, 433);
                ctx.fillStyle = '#38bdf8';
                ctx.fillText('Press "F" for Fullscreen', GAME_WIDTH / 2, 455);
                ctx.restore();

            } else if (currentState === STATE.PLAYING) {
                ctx.save();
                ctx.fillStyle = '#ffffff';
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 3;
                ctx.font = '48px "Fredoka One", cursive, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(score, GAME_WIDTH / 2, 90);
                ctx.restore();

            } else if (currentState === STATE.GAMEOVER) {
                ctx.save();
                ctx.fillStyle = 'rgba(15, 23, 42, 0.45)';
                ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

                const boxX = 40;
                const boxY = 150;
                const boxWidth = GAME_WIDTH - 80;
                const boxHeight = 270;

                ctx.fillStyle = '#1e293b';
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 25;
                ctx.shadowOffsetY = 10;
                ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 24);
                ctx.fill();

                ctx.lineWidth = 3;
                ctx.strokeStyle = '#334155';
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.fillStyle = '#ef4444';
                ctx.font = '32px "Fredoka One", cursive, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', GAME_WIDTH / 2, boxY + 50);

                ctx.fillStyle = '#94a3b8';
                ctx.font = 'bold 14px "Nunito", sans-serif';
                ctx.fillText('SCORE', GAME_WIDTH / 2 - 60, boxY + 100);
                ctx.fillText('BEST', GAME_WIDTH / 2 + 60, boxY + 100);

                ctx.fillStyle = '#ffffff';
                ctx.font = '32px "Fredoka One", cursive, sans-serif';
                ctx.fillText(score, GAME_WIDTH / 2 - 60, boxY + 140);
                ctx.fillText(highScore, GAME_WIDTH / 2 + 60, boxY + 140);

                // Medal Achievement
                if (score >= 10) {
                    let medalColor = '#cd7f32'; // Bronze
                    if (score >= 40) medalColor = '#eab308'; // Gold
                    else if (score >= 20) medalColor = '#94a3b8'; // Silver

                    ctx.fillStyle = medalColor;
                    ctx.beginPath();
                    ctx.arc(GAME_WIDTH / 2, boxY + 175, 16, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = '12px "Fredoka One", cursive, sans-serif';
                    ctx.fillText('★', GAME_WIDTH / 2, boxY + 179);
                }

                // Play Again Button Overlay
                const btnY = boxY + 220;
                ctx.fillStyle = '#22c55e';
                ctx.roundRect(GAME_WIDTH / 2 - 80, btnY - 25, 160, 44, 22);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px "Nunito", sans-serif';
                ctx.fillText('PLAY AGAIN', GAME_WIDTH / 2, btnY + 3);

                ctx.restore();
            }
        }

        // --- Main Game Loop ---
        function gameLoop() {
            ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            ctx.save();
            if (shakeTime > 0) {
                const dx = (Math.random() - 0.5) * shakeTime;
                const dy = (Math.random() - 0.5) * shakeTime;
                ctx.translate(dx, dy);
                shakeTime--;
            }

            // Updates
            if (currentState === STATE.START) {
                bird.wingTimer += 0.1;
                bird.wingFrame = Math.sin(bird.wingTimer);
                bird.y = 280 + Math.sin(Date.now() * 0.004) * 8;
            } else if (currentState === STATE.PLAYING) {
                bird.update();
                pipes.update();
                checkCollisions();
            } else if (currentState === STATE.GAMEOVER) {
                if (bird.y + bird.height / 2 < GAME_HEIGHT - 120) {
                    bird.velocity += bird.gravity;
                    bird.y += bird.velocity;
                    bird.rotation = Math.min(Math.PI / 2, bird.rotation + 0.1);
                }
            }

            // Rendering
            drawBackground();
            pipes.draw();
            drawForeground();
            bird.draw();
            drawUI();

            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        // --- Control Handlers ---
        function handleInput(e) {
            if (e) e.preventDefault();
            audio.init();

            if (currentState === STATE.START) {
                currentState = STATE.PLAYING;
                score = 0;
                bird.reset();
                pipes.reset();
                bird.flap();
            } else if (currentState === STATE.PLAYING) {
                bird.flap();
            } else if (currentState === STATE.GAMEOVER && shakeTime === 0) {
                currentState = STATE.START;
                bird.reset();
                pipes.reset();
            }
        }

        // Keyboard & Touch Listeners
        window.addEventListener('keydown', (e) => {
            if (e.code === 'KeyF') {
                toggleFullscreen();
                return;
            }
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                handleInput(e);
            }
        });

        canvas.addEventListener('pointerdown', (e) => {
            handleInput(e);
        });

        // Initialize Loop on Window Load
        window.onload = function () {
            resizeCanvas();
            gameLoop();
        };
    </script>
</body>
</html>
